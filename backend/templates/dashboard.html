<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>POS</h2>
        </div>

        <ul>
            <li class="active">
                <a href="dashboard.html">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="sales.html">
                    <i class="fas fa-cash-register"></i>
                    <span>Sales</span>
                </a>
            </li>

            <li>
                <a href="products.html">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
            </li>

            <li>
                <a href="inventory.html">
                    <i class="fas fa-warehouse"></i>
                    <span>Inventory</span>
                </a>
            </li>

            <li>
                <a href="categories.html">
                    <i class="fas fa-tags"></i>
                    <span>Categories</span>
                </a>
            </li>

            <li>
                <a href="repairs.html">
                    <i class="fas fa-tools"></i>
                    <span>Repairs</span>
                </a>
            </li>

            <li>
                <a href="reports.html">
                    <i class="fas fa-file-alt"></i>
                    <span>Reports</span>
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">

            <h1>Dashboard</h1>

            <div class="user">
                <i class="fas fa-user-circle"></i>
                Admin
            </div>

        </header>

        <section class="cards">

            <div class="card">
                <h3>Today's Revenue</h3>
                <p id="todayRevenue">KES 0</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p id="todayOrders">0</p>
            </div>

            <div class="card">
                <h3>Average Sale</h3>
                <p id="todayAvgSale">KES 0</p>
            </div>

            <div class="card">
                <h3>Gross Profit</h3>
                <p id="todayGrossProfit">KES 0</p>
            </div>

        </section>        

        <section class="dashboard-grid">

            <div class="chart-card sales-trend">
                <h2>Sales Trend</h2>
                <canvas id="salesTrend"></canvas>
            </div>

            <div class="chart-card">
                <h2>Top Selling Products</h2>
                <canvas id="topProducts"></canvas>
            </div>

            <div class="chart-card">
                <h2>Revenue By Hour</h2>
                <canvas id="hourlyRevenue"></canvas>
            </div>

            <div class="chart-card">
                <h2>Payment Methods</h2>
                <canvas id="paymentMethods"></canvas>
            </div>

            <div class="chart-card full-width">
                <h2>Inventory Status</h2>
                <canvas id="inventoryStatus"></canvas>
            </div>

        </section>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/js/script.js"></script>
<script src="assets/js/chart.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
