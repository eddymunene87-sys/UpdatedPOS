<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS My Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo"><h2>POS</h2></div>
        <ul>
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i><span>Dashboard</span></a></li>
            <li><a href="sales.html"><i class="fas fa-cash-register"></i><span>Sales</span></a></li>
            <li><a href="products.html"><i class="fas fa-box"></i><span>Products</span></a></li>
            <li><a href="inventory.html"><i class="fas fa-warehouse"></i><span>Inventory</span></a></li>
            <li><a href="categories.html"><i class="fas fa-tags"></i><span>Categories</span></a></li>
            <li><a href="repairs.html"><i class="fas fa-tools"></i><span>Repairs</span></a></li>
            <li><a href="reports.html"><i class="fas fa-file-alt"></i><span>Reports</span></a></li>
            <li class="active"><a href="account.html"><i class="fas fa-user-cog"></i><span>My Account</span></a></li>
        </ul>
    </aside>
    <main class="main-content">
        <header class="topbar"><h1>My Account</h1><div class="user"><i class="fas fa-user-circle"></i>Loading...</div></header>
        <section class="search-section">
            <div class="report-summary">
                <h2>Personal information</h2>
                <p>Update your name and email address. Your manager assigns your role and duty.</p>
            </div>
            <form id="accountForm">
                <div class="form-grid">
                    <div class="form-group"><label for="accountUsername">Username</label><input id="accountUsername" readonly></div>
                    <div class="form-group"><label for="accountFirstName">First name</label><input id="accountFirstName" required></div>
                    <div class="form-group"><label for="accountLastName">Last name</label><input id="accountLastName" required></div>
                    <div class="form-group"><label for="accountEmail">Email address</label><input id="accountEmail" type="email"></div>
                    <div class="form-group"><label for="accountRole">Role</label><input id="accountRole" readonly></div>
                    <div class="form-group"><label for="accountDuty">Assigned duty</label><input id="accountDuty" readonly></div>
                </div>
                <button class="pay-button" type="submit">Save Changes</button>
                <div id="accountMessage" class="product-message"></div>
            </form>
        </section>
    </main>
</div>
<script src="assets/js/script.js"></script>
<script src="assets/js/account.js"></script>
</body>
</html>
