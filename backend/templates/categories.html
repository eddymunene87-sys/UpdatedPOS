<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo"><h2>POS</h2></div>
        <ul>
            <li><a href="dashboard.html"><i class="fas fa-chart-line"></i><span>Dashboard</span></a></li>
            <li><a href="sales.html"><i class="fas fa-cash-register"></i><span>Sales</span></a></li>
            <li><a href="products.html"><i class="fas fa-box"></i><span>Products</span></a></li>
            <li><a href="inventory.html"><i class="fas fa-warehouse"></i><span>Inventory</span></a></li>
            <li class="active"><a href="categories.html"><i class="fas fa-tags"></i><span>Categories</span></a></li>
            <li><a href="repairs.html"><i class="fas fa-tools"></i><span>Repairs</span></a></li>
            <li><a href="reports.html"><i class="fas fa-file-alt"></i><span>Reports</span></a></li>
        </ul>
    </aside>
    <main class="main-content">
        <header class="topbar"><h1>Categories</h1><div class="user"><i class="fas fa-user-circle"></i>Admin</div></header>

        <section class="search-section">
            <div class="report-summary">
                <h2>Create a category</h2>
                <p>Add categories so products can be assigned correctly.</p>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="categoryName">Category Name</label>
                    <input id="categoryName" type="text" placeholder="Enter category">
                </div>
            </div>
            <button id="addCategoryButton" class="pay-button">Save Category</button>
            <div id="categoryMessage" class="product-message"></div>
            <div id="categoryList" class="product-results empty-state"></div>
        </section>
    </main>
</div>
<script src="assets/js/script.js"></script>
<script src="assets/js/categories.js"></script>
</body>
</html>
